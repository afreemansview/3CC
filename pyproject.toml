[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chairs"
version = "0.1.0"
description = "Toolkit for the Third Continental Congress AI–human dialogue"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "python-dotenv>=1"]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
xai = ["openai"]          # xAI's API is OpenAI-compatible
gemini = ["google-genai"]
x = ["tweepy>=4.14"]
all = ["anthropic", "openai", "google-genai", "tweepy>=4.14"]
dev = ["pytest"]

[project.scripts]
chairs = "chairs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
